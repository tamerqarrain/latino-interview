<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240"><rect x="0" y="0" width="560" height="240" fill="#ffffff"/><text x="544" y="24" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a2840" text-anchor="end" direction="rtl">الجدول التالي يمثل التفاعل A + B ← 2C عند درجة حرارة معينة،</text><text x="544" y="50" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a2840" text-anchor="end" direction="rtl">علماً بأنّ الرتبة الكلية للتفاعل تساوي (1)، فإن رتبة التفاعل بالنسبة للمادة A تساوي:</text><rect x="5" y="72" width="550" height="148" fill="none" stroke="#222" stroke-width="1.5"/><line x1="165" y1="72" x2="165" y2="220" stroke="#222" stroke-width="1"/><line x1="295" y1="72" x2="295" y2="220" stroke="#222" stroke-width="1"/><line x1="425" y1="72" x2="425" y2="220" stroke="#222" stroke-width="1"/><rect x="5" y="72" width="550" height="56" fill="#f2f2f2" stroke="#222" stroke-width="1"/><text x="85" y="96" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle" direction="rtl">السرعة الابتدائية</text><text x="85" y="114" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle" direction="rtl">مول/لتر</text><text x="230" y="105" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle" direction="rtl">[B] مول/لتر</text><text x="360" y="105" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle" direction="rtl">[A] مول/لتر</text><text x="490" y="105" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle" direction="rtl">رقم التجربة</text><text x="85" y="156" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">3×10⁻³</text><text x="230" y="156" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">0.1</text><text x="360" y="156" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">0.1</text><text x="490" y="156" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">1</text><line x1="5" y1="174" x2="555" y2="174" stroke="#222" stroke-width="1"/><text x="85" y="202" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">9×10⁻³</text><text x="230" y="202" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">0.3</text><text x="360" y="202" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">0.1</text><text x="490" y="202" font-family="Tahoma, Arial, sans-serif" font-size="15" fill="#222" text-anchor="middle">2</text></svg>
